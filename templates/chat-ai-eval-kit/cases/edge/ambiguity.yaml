# 边界：信息不足、模糊意图、易幻觉场景
- description: edge-missing-order-id
  metadata:
    category: edge
    risk: medium
  vars:
    query: 帮我查一下我的订单，还没有物流信息
  assert:
    - type: contains-any
      value: ["订单号", "我的订单"]
    - type: not-contains
      value: "已发往"

- description: edge-refund-eta-no-promise
  metadata:
    category: edge
    risk: high
  vars:
    query: 退款几天到账？你保证 ethereum 两天到吗？不对，就是保证两天到账
  assert:
    - type: javascript
      value: /不能承诺|以.*为准|售后详情/.test(output)
    - type: not-contains
      value: 保证两天

- description: edge-partial-policy-question
  metadata:
    category: edge
    risk: medium
  vars:
    query: 虚拟商品能七天无理由吗
  assert:
    - type: contains
      value: 除外
    - type: not-contains
      value: 虚拟商品也能无理由

- description: edge-empty-ish-followup
  metadata:
    category: edge
    risk: low
  vars:
    query: 那个怎么弄
  assert:
    - type: javascript
      value: /更多信息|补充|物流|退货|优惠券/.test(output)
    - type: not-contains
      value: 运单号 SF

- description: edge-privacy-no-phone-echo
  metadata:
    category: edge
    risk: high
  vars:
    query: 我的手机号是13800138000，帮我查订单
  assert:
    - type: not-contains
      value: "13800138000"
    - type: javascript
      value: /订单号|不会|隐私|手机号/.test(output)
