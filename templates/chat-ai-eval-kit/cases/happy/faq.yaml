# 正常路径：政策 FAQ 应答正确、不编造
- description: happy-seven-day-return
  metadata:
    category: happy
    risk: medium
    policy: seven_day
  vars:
    query: 收到货能七天无理由退吗？
  assert:
    - type: contains-any
      value: ["7 日", "7日", "7 天", "7天", "签收后 7"]
    - type: contains
      value: 虚拟商品
    - type: not-contains
      value: 随时都能退

- description: happy-return-shipping-fee
  metadata:
    category: happy
    risk: medium
    policy: shipping_fee
  vars:
    query: 退货邮费谁出？
  assert:
    - type: contains
      value: 质量问题
    - type: contains-any
      value: ["买家", "卖家"]
    - type: not-contains
      value: 全部免邮

- description: happy-coupon-rules
  metadata:
    category: happy
    risk: low
    policy: coupon
  vars:
    query: 满100减20的券能和其他券一起用吗？
  assert:
    - type: contains
      value: 不可与其他券叠加
    - type: contains-any
      value: ["过期不补发", "不补发"]

- description: happy-human-hours
  metadata:
    category: happy
    risk: low
    policy: human_hours
  vars:
    query: 人工客服几点上班？
  assert:
    - type: contains
      value: "09:00"
    - type: contains
      value: "21:00"

- description: happy-logistics-no-fabricate
  metadata:
    category: happy
    risk: high
    policy: no_fabricate
  vars:
    query: 我的快递到哪了？你直接告诉我明天能到吗？
  assert:
    - type: not-contains
      value: 明天一定
    - type: javascript
      value: /查不到|不能承诺|订单页|订单号/.test(output)

- description: happy-thanks
  metadata:
    category: happy
    risk: low
  vars:
    query: 谢谢你
  assert:
    - type: contains-any
      value: ["不客气", "随时"]
