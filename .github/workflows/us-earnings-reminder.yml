name: US Earnings Reminder

on:
  schedule:
    - cron: "0 0 * * 1-5"
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run earnings reminder
        env:
          FINNHUB_API_TOKEN: ${{ secrets.FINNHUB_API_TOKEN }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          EARNINGS_WHITELIST: ${{ secrets.EARNINGS_WHITELIST }}
          LOOKAHEAD_DAYS: ${{ vars.LOOKAHEAD_DAYS || '1' }}
          LOOKBACK_DAYS: ${{ vars.LOOKBACK_DAYS || '0' }}
        run: python scripts/us_earnings_reminder.py
