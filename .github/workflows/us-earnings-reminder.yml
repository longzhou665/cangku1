name: US Earnings Reminder
# refresh
on:
  schedule:
    # Target ~premarket in America/New_York via multiple UTC hours + minute offsets.
    # The script does NOT hard-reject runs based on "expected UTC hour" (GitHub schedule can be delayed).
    - cron: "0 8,9 * * 1-5"
    # Extra minute buckets to reduce "missed window" risk when dispatch is delayed within the hour.
    - cron: "15 8,9 * * 1-5"
    - cron: "30 8,9 * * 1-5"
    - cron: "45 8,9 * * 1-5"
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Restore sent-state cache
        uses: actions/cache@v5
        with:
          path: .cache
          key: earnings-sent-state-${{ github.repository }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run earnings reminder
        env:
          EARNINGS_DATA_SOURCE: ${{ vars.EARNINGS_DATA_SOURCE || 'finnhub' }}
          FINNHUB_API_TOKEN: ${{ secrets.FINNHUB_API_TOKEN }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          EARNINGS_WHITELIST: ${{ secrets.EARNINGS_WHITELIST }}
          REMINDER_OFFSETS: ${{ vars.REMINDER_OFFSETS || '0,1,7' }}
          PREMARKET_ONLY: ${{ vars.PREMARKET_ONLY || 'true' }}
          DEDUPE_WEBHOOKS: ${{ vars.DEDUPE_WEBHOOKS || 'true' }}
          LOOKAHEAD_DAYS: ${{ vars.LOOKAHEAD_DAYS || '1' }}
          LOOKBACK_DAYS: ${{ vars.LOOKBACK_DAYS || '0' }}
          EARNINGS_HOUR_DEFAULTS: ${{ vars.EARNINGS_HOUR_DEFAULTS || '' }}
        run: python scripts/us_earnings_reminder.py
